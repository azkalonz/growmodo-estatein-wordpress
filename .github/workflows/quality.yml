name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:2.10.2

      - name: Install PHP quality tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        run: composer lint:php

      - name: Run WordPress coding standards
        run: composer phpcs

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Validate Docker Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend quality tools
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Check formatting
        run: npm run format:check

      - name: Audit Node dependencies
        run: npm run audit

      - name: Build and verify Wasmer handoff
        run: make wasmer

      - name: Upload Wasmer handoff
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: wasmer-wordpress-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  deploy-wasmer-preview:
    name: Deploy Wasmer preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: wasmer-estatein-preview
      cancel-in-progress: false
    environment:
      name: wasmer-preview
      url: https://estatein-preview.wasmer.app/
    env:
      ESTATEIN_WASMER_APP: azkalonz/estatein-preview
      ESTATEIN_WASMER_VOLUME: wp-content
      ESTATEIN_BASE_URL: https://estatein-preview.wasmer.app
      WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
      WASMER_VERSION: 7.2.1
      WASMER_LINUX_AMD64_SHA256: c46d6ff34a12b40d2e57bfc2ccbb8b9e209b0987ab305233619798b264a6bae5
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v7

      - name: Download verified handoff
        uses: actions/download-artifact@v7
        with:
          name: wasmer-wordpress-${{ github.sha }}
          path: dist

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rclone

      - name: Install pinned Wasmer CLI
        run: |
          archive="${RUNNER_TEMP}/wasmer-linux-amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/wasmer"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/wasmerio/wasmer/releases/download/v${WASMER_VERSION}/wasmer-linux-amd64.tar.gz" \
            --output "${archive}"
          echo "${WASMER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      - name: Deploy theme and plugin to Wasmer
        run: ./scripts/deploy-wasmer-volume.sh

      - name: Record deployment
        run: |
          {
            echo "### Wasmer preview deployed"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${ESTATEIN_BASE_URL}/"
            echo "- Scope: Estatein theme and Estatein Core plugin"
          } >> "${GITHUB_STEP_SUMMARY}"
